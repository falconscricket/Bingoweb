<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Couple Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3b2a2f;
    --rose:#b3455a;
    --rose-deep:#8f2f43;
    --rose-soft:#f7e9ec;
    --gold:#c9974a;
    --gold-soft:#f3e6cd;
    --cream:#fffaf4;
    --line:#e7d8c9;
    --shadow: 0 24px 60px rgba(80,30,45,.16);
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:'Manrope', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(201,151,74,.14) 0%, transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(179,69,90,.12) 0%, transparent 42%),
      linear-gradient(160deg, #fdf6ee 0%, #f7ece2 45%, #f3e4de 100%);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    color:var(--ink);
    overflow:hidden;
    position:relative;
  }

  .hearts-bg { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .hearts-bg span {
    position:absolute; bottom:-40px; opacity:.18; color:var(--rose);
    animation: floatUp linear infinite;
    font-size:14px;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity:0; }
    12% { opacity:.22; }
    88% { opacity:.14; }
    100% { transform: translateY(-110vh) rotate(18deg); opacity:0; }
  }

  .card {
    background: rgba(255,253,249,0.92);
    backdrop-filter: blur(14px);
    border-radius: 22px;
    padding: 36px 30px;
    max-width: 460px;
    width:100%;
    box-shadow: var(--shadow), 0 0 0 1px rgba(201,151,74,.18) inset;
    text-align:center;
    position:relative;
    z-index:1;
    border:1px solid rgba(201,151,74,.25);
  }

  h1 {
    font-family:'Playfair Display', serif;
    font-weight:800;
    font-size:30px; color:var(--rose-deep); margin-bottom:6px;
    letter-spacing:.3px;
  }
  h1 .accent { color: var(--gold); font-style:italic; font-weight:700; }
  .sub {
    font-size:13px; color:#8a6b6f; margin-bottom:24px; font-weight:600;
    letter-spacing:.2px;
  }
  .divider {
    width:44px; height:2px; margin:14px auto 20px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  input {
    width:100%; padding:14px 16px; border-radius:12px;
    border:1.5px solid var(--line); margin-bottom:12px; font-size:15px;
    outline:none; text-align:center; letter-spacing:.5px;
    font-family:'Manrope',sans-serif; font-weight:600; color:var(--ink);
    background:var(--cream); transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder{ color:#b79a95; font-weight:500; }
  input:focus { border-color:var(--rose); box-shadow:0 0 0 4px rgba(179,69,90,.10); }

  button {
    border:none; border-radius:12px; padding:14px 18px;
    font-size:14.5px; font-weight:700; cursor:pointer;
    font-family:'Manrope',sans-serif; letter-spacing:.3px;
    transition: transform .12s, box-shadow .12s, opacity .12s, filter .12s;
  }
  button:hover { filter:brightness(1.04); box-shadow: 0 10px 22px rgba(143,47,67,.22); }
  button:active { transform:scale(0.97); }
  .btn-main {
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
    color:#fff8f3; width:100%; margin-top:4px;
    box-shadow: 0 10px 24px rgba(143,47,67,.28);
    text-transform:uppercase; font-size:13px; letter-spacing:1.2px;
  }
  .btn-main:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
  .btn-row { display:flex; gap:10px; margin-top:10px; }
  .btn-sec {
    flex:1; background:var(--rose-soft); color:var(--rose-deep); border:1.5px solid var(--line);
    text-transform:uppercase; font-size:12.5px; letter-spacing:1px;
  }

  .room-code {
    font-family:'Playfair Display', serif;
    font-size:36px; font-weight:800; letter-spacing:9px; color:var(--rose-deep);
    background:var(--gold-soft); border-radius:14px; padding:14px 0; margin:18px 0;
    border:1.5px dashed var(--gold);
  }
  .players { display:flex; justify-content:center; gap:14px; margin:16px 0; flex-wrap:wrap; }
  .chip {
    background:var(--rose-soft); border:1.5px solid var(--line); border-radius:999px;
    padding:8px 18px; font-size:13.5px; font-weight:700; color:var(--rose-deep);
  }
  .chip.me { background:linear-gradient(135deg,var(--rose),var(--rose-deep)); border-color:var(--rose-deep); color:#fff8f3; }

  .grid {
    display:grid; grid-template-columns: repeat(5,1fr); gap:8px;
    margin:20px 0; user-select:none;
  }
  .cell {
    position:relative;
    aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    background:var(--cream); border:1.5px solid var(--line); border-radius:10px;
    font-weight:700; font-size:16px; color:var(--ink); cursor:default;
    font-family:'Manrope', sans-serif;
    transition: background .2s, border-color .2s, color .3s;
    overflow:hidden;
  }
  .cell .strike {
    position:absolute; left:6%; top:50%; width:88%; height:2.5px;
    background: var(--rose-deep);
    transform-origin: left center;
    transform: translateY(-50%) scaleX(0) rotate(-9deg);
    transition: transform .32s cubic-bezier(.65,0,.35,1);
    border-radius:2px;
  }
  .cell.marked .strike { transform: translateY(-50%) scaleX(1) rotate(-9deg); }
  .cell.marked {
    color: var(--rose-deep);
    background: var(--rose-soft);
    border-color: var(--rose);
  }

  .cell.heart-five {
    background: linear-gradient(155deg, var(--gold-soft), #fff);
    border:1.5px solid var(--gold);
    color:var(--rose-deep);
    font-family:'Playfair Display', serif;
    font-size:18px;
  }
  .cell.heart-five::before {
    content:"";
    position:absolute; top:4px; right:5px; width:5px; height:5px;
    border-radius:50%; background:var(--gold);
  }
  .cell.heart-five.marked {
    background: linear-gradient(155deg, var(--rose-soft), var(--gold-soft));
  }
  .cell.heart-five .strike { background: var(--gold); }

  .status-bar {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:12px; font-size:13.5px; font-weight:700; color:var(--rose-deep);
  }
  .timer {
    background:var(--rose-soft); border:1.5px solid var(--line); border-radius:999px;
    padding:6px 16px; font-size:14px; font-weight:800; color:var(--rose-deep);
    font-family:'Playfair Display', serif;
  }
  .timer.low { color:#fff8f3; background:linear-gradient(135deg,var(--rose),var(--rose-deep)); }
  .callpad {
    display:grid; grid-template-columns: repeat(5,1fr); gap:6px; margin:18px 0;
  }
  .callbtn {
    background:#fff; border:1.5px solid var(--line); border-radius:9px;
    padding:9px 0; font-size:13.5px; font-weight:700; color:var(--ink);
    position:relative; font-family:'Manrope',sans-serif;
  }
  .callbtn.is-five { border-color:var(--gold); color:var(--rose-deep); background:var(--gold-soft); }
  .callbtn.used { background:#f1eae4; color:#b7a89f; border-color:#e5dcd3; cursor:not-allowed; text-decoration:line-through; }
  .callbtn:disabled { cursor:not-allowed; opacity:.65; }
  .called-log {
    font-size:12px; color:#8a6b6f; margin-bottom:8px; min-height:16px;
    word-break: break-word; font-weight:600; letter-spacing:.2px;
  }
  .msg { font-size:13.5px; color:var(--rose-deep); margin:10px 0; font-weight:700; }
  .heart-loader { font-size:30px; opacity:.55; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1); opacity:.5;} 50%{transform:scale(1.12); opacity:.8;} }

  .winner-wrap { position:relative; padding-top:6px; }
  .winner-badge {
    width:64px; height:64px; margin:0 auto 14px;
    border-radius:50%;
    background: linear-gradient(150deg, var(--gold), var(--rose));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 12px 26px rgba(143,47,67,.32);
    animation: badgeIn .55s cubic-bezier(.2,1.4,.4,1) both;
  }
  .winner-badge svg { width:28px; height:28px; }
  @keyframes badgeIn { from{ transform:scale(0.3) rotate(-25deg); opacity:0; } to{ transform:scale(1) rotate(0); opacity:1; } }
  .winner-eyebrow {
    font-size:11.5px; letter-spacing:2.5px; text-transform:uppercase;
    color:var(--gold); font-weight:800; margin-bottom:6px;
  }
  .winner-banner {
    font-family:'Playfair Display', serif;
    font-size:26px; font-weight:800; color:var(--rose-deep); margin-bottom:4px;
    animation: fadeUp .5s ease .05s both;
  }
  .winner-sub { font-size:13px; color:#8a6b6f; font-weight:600; margin-bottom:18px; animation: fadeUp .5s ease .12s both; }
  @keyframes fadeUp { from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

  .confetti { position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:22px; }
  .confetti span {
    position:absolute; top:-10px; width:6px; height:10px; opacity:.85;
    animation: confettiFall 2.6s ease-in forwards;
    border-radius:1px;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity:1; }
    100% { transform: translateY(320px) rotate(280deg); opacity:0; }
  }

  .error { color:#a13b3b; font-size:12.5px; margin-top:8px; font-weight:700; }
</style>
</head>
<body>
<div class="hearts-bg" id="heartsBg"></div>
<div class="card" id="app"><div class="heart-loader">♥</div></div>

<script>
const API = '/api';
const APP = document.getElementById('app');
let myName = '';
let myId = '';
let roomCode = '';
let pollHandle = null;
let timerInterval = null;
let myBoardNums = [];
let localAutoCallDone = false;
const TURN_SECONDS = 15;

(function initHeartsBg(){
  const bg = document.getElementById('heartsBg');
  const symbols = ['♥','♡'];
  for(let i=0;i<10;i++){
    const s = document.createElement('span');
    s.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    s.style.left = Math.random()*100 + 'vw';
    s.style.fontSize = (10 + Math.random()*14) + 'px';
    s.style.animationDuration = (14 + Math.random()*14) + 's';
    s.style.animationDelay = (Math.random()*10) + 's';
    bg.appendChild(s);
  }
})();

async function api(path, method='GET', body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(API + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function shuffleArr(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function genBoard(){
  const nums = [];
  for(let i=1;i<=25;i++) nums.push(i);
  return shuffleArr(nums);
}
function gridNumberAt(idx){ return myBoardNums[idx]; }
function otherId(id){ return id==='p1' ? 'p2' : 'p1'; }

function renderJoin(errorMsg){
  stopPoll();
  APP.innerHTML = `
    <h1>Couple <span class="accent">Bingo</span></h1>
    <div class="sub">A sweet little 5×5 bingo, just for the two of you</div>
    <div class="divider"></div>
    <input id="nameInput" placeholder="Your name" maxlength="14" />
    <input id="codeInput" placeholder="Room code (leave blank to create)" maxlength="4" />
    <button class="btn-main" id="joinBtn">Join / Create Room</button>
    ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
  `;
  document.getElementById('joinBtn').onclick = handleJoin;
}

async function handleJoin(){
  const name = document.getElementById('nameInput').value.trim();
  const code = document.getElementById('codeInput').value.trim();
  if(!name){ renderJoin('Please enter your name'); return; }
  try {
    const data = await api('/rooms', 'POST', { name, code: code || undefined });
    myName = name;
    roomCode = data.code;
    myId = data.playerId;
    myBoardNums = genBoard();
    await api(`/rooms/${roomCode}/board`, 'POST', { playerId: myId, board: myBoardNums });
    startPoll();
  } catch(e){
    renderJoin(e.message);
  }
}

function renderWaiting(room){
  APP.innerHTML = `
    <h1>Waiting<span class="accent">...</span></h1>
    <div class="sub">Share this code with your partner</div>
    <div class="room-code">${room.code}</div>
    <div class="players">
      ${room.players.map(p=>`<div class="chip ${p.id===myId?'me':''}">${p.name}</div>`).join('')}
    </div>
    <div class="msg">Waiting for your partner to join...</div>
    <div class="heart-loader">♥</div>
  `;
}

function renderArrange(room){
  APP.innerHTML = `
    <h1>Arrange Your Board</h1>
    <div class="sub">The signature cell (5) is marked in gold — shuffle till it feels right</div>
    <div class="grid" id="grid"></div>
    <div class="btn-row">
      <button class="btn-sec" id="shuffleBtn">Shuffle</button>
      <button class="btn-main" id="readyBtn" style="flex:1">Ready</button>
    </div>
    <div class="msg" id="readyMsg">${room.ready && room.ready.includes(myId) ? 'Waiting for your partner...' : ''}</div>
  `;
  drawGrid([]);
  document.getElementById('shuffleBtn').onclick = async () => {
    myBoardNums = genBoard();
    await api(`/rooms/${roomCode}/board`, 'POST', { playerId: myId, board: myBoardNums });
    drawGrid([]);
  };
  document.getElementById('readyBtn').onclick = async () => {
    await api(`/rooms/${roomCode}/ready`, 'POST', { playerId: myId });
    document.getElementById('readyMsg').textContent = 'Waiting for your partner...';
  };
}

function drawGrid(markedNums){
  const grid = document.getElementById('grid');
  if(!grid) return;
  const markedSet = new Set(markedNums);
  let html = '';
  for(let i=0;i<25;i++){
    const n = gridNumberAt(i);
    const marked = markedSet.has(n);
    const isFive = n === 5;
    html += `<div class="cell ${marked?'marked':''} ${isFive?'heart-five':''}">${n}<span class="strike"></span></div>`;
  }
  grid.innerHTML = html;
}

function renderPlaying(room){
  const me = room.players.find(p=>p.id===myId);
  const opp = room.players.find(p=>p.id!==myId);
  const myTurn = room.turn === myId;
  const markedSet = new Set(room.calledNumbers);

  APP.innerHTML = `
    <div class="status-bar">
      <span>${me?me.name:''}</span>
      <span class="timer" id="timerBox">--</span>
      <span>${opp?opp.name:'...'}</span>
    </div>
    <div class="msg" id="turnMsg">${myTurn ? "Your turn — call a number" : (opp?opp.name:'Partner')+"'s turn..."}</div>
    <div class="grid" id="grid"></div>
    <div class="called-log">Called: ${room.calledNumbers.length ? room.calledNumbers.join(', ') : 'none yet'}</div>
    <div class="callpad" id="callpad"></div>
  `;
  drawGrid(room.calledNumbers);

  const pad = document.getElementById('callpad');
  let padHtml = '';
  for(let i=1;i<=25;i++){
    const used = markedSet.has(i);
    const isFive = i === 5;
    padHtml += `<button class="callbtn ${used?'used':''} ${isFive?'is-five':''}" data-n="${i}" ${(!myTurn||used)?'disabled':''}>${i}</button>`;
  }
  pad.innerHTML = padHtml;
  if(myTurn){
    pad.querySelectorAll('.callbtn:not(.used)').forEach(btn=>{
      btn.onclick = () => callNumber(parseInt(btn.dataset.n));
    });
  }

  if(timerInterval) clearInterval(timerInterval);
  localAutoCallDone = false;
  timerInterval = setInterval(()=>{
    if(!room.turnStartedAt) return;
    const elapsed = Math.floor((Date.now()-room.turnStartedAt)/1000);
    const left = TURN_SECONDS - elapsed;
    const box = document.getElementById('timerBox');
    if(box){
      box.textContent = Math.max(left,0)+'s';
      box.classList.toggle('low', left<=5);
    }
    if(left<=0 && myTurn && !localAutoCallDone){
      localAutoCallDone = true;
      autoCall();
    }
  },300);
}

async function callNumber(n){
  try { await api(`/rooms/${roomCode}/call`, 'POST', { playerId: myId, number: n }); }
  catch(e) { /* ignore race - poll will resync */ }
}

async function autoCall(){
  const remaining = [];
  const res = await fetch(`${API}/rooms/${roomCode}?playerId=${myId}`);
  const { room } = await res.json();
  for(let i=1;i<=25;i++) if(!room.calledNumbers.includes(i)) remaining.push(i);
  if(remaining.length===0) return;
  const pick = remaining[Math.floor(Math.random()*remaining.length)];
  await callNumber(pick);
}

function confettiHtml(){
  const colors = ['#c9974a','#b3455a','#e3b673','#8f2f43'];
  let html = '';
  for(let i=0;i<24;i++){
    const left = Math.random()*100;
    const delay = Math.random()*0.6;
    const dur = 2 + Math.random()*1.4;
    const color = colors[Math.floor(Math.random()*colors.length)];
    html += `<span style="left:${left}%; background:${color}; animation-delay:${delay}s; animation-duration:${dur}s;"></span>`;
  }
  return html;
}

function renderFinished(room){
  if(timerInterval) clearInterval(timerInterval);
  const winner = room.players.find(p=>p.id===room.winner);
  const iWon = room.winner === myId;
  const title = iWon ? 'You Won!' : (winner ? winner.name + ' Won!' : 'Game Over');
  const sub = iWon ? 'Five in a row — well played' : "Five in a row for your partner — this round's theirs";

  APP.innerHTML = `
    <div class="winner-wrap">
      <div class="confetti">${confettiHtml()}</div>
      <div class="winner-badge">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21s-7.5-4.6-10-9.3C.6 8.1 2.6 4.5 6 4.1c2-.2 3.6.8 6 3 2.4-2.2 4-3.2 6-3 3.4.4 5.4 4 3 7.6C19.5 16.4 12 21 12 21z" stroke="#fff8f3" stroke-width="1.4" fill="#fff8f3" fill-opacity="0.15"/>
        </svg>
      </div>
      <div class="winner-eyebrow">Five in a row</div>
      <div class="winner-banner">${title}</div>
      <div class="winner-sub">${sub}</div>
      <div class="grid" id="grid"></div>
      <button class="btn-main" id="againBtn" style="margin-top:18px;">Play Again</button>
    </div>
  `;
  drawGrid(room.calledNumbers);
  document.getElementById('againBtn').onclick = async () => {
    await api(`/rooms/${roomCode}/reset`, 'POST', { playerId: myId });
    myBoardNums = genBoard();
    await api(`/rooms/${roomCode}/board`, 'POST', { playerId: myId, board: myBoardNums });
  };
}

function startPoll(){
  stopPoll();
  pollHandle = setInterval(tick, 1200);
  tick();
}
function stopPoll(){
  if(pollHandle){ clearInterval(pollHandle); pollHandle = null; }
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}
async function tick(){
  let room;
  try {
    const res = await fetch(`${API}/rooms/${roomCode}?playerId=${myId}`);
    if(!res.ok) return;
    const data = await res.json();
    room = data.room;
    if(room.myBoard) myBoardNums = room.myBoard;
  } catch(e){ return; }

  if(room.status === 'waiting'){
    if(room.players.length >= 2) renderArrange(room);
    else renderWaiting(room);
  } else if(room.status === 'arranging'){
    renderArrange(room);
  } else if(room.status === 'playing'){
    renderPlaying(room);
  } else if(room.status === 'finished'){
    renderFinished(room);
  }
}

renderJoin();
</script>
</body>
</html>
