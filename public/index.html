<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tazzu Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3b2233;
    --rose:#e0466f;
    --rose-deep:#a2274d;
    --rose-soft:#fbe8ef;
    --gold:#d9a24b;
    --gold-soft:#f6ecd6;
    --cream:#fffaf7;
    --line:#f0d9e2;
    --frame-1:#c98a9c;
    --frame-2:#8f2f52;
    --shadow: 0 24px 60px rgba(120,20,60,.20);
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:'Manrope', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(224,70,111,.14) 0%, transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(217,162,75,.14) 0%, transparent 42%),
      linear-gradient(160deg, #fdf1f4 0%, #faeaee 45%, #f6e6e9 100%);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    color:var(--ink);
    overflow:hidden;
    position:relative;
  }

  .hearts-bg { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .hearts-bg span {
    position:absolute; bottom:-40px; opacity:.20; color:var(--rose);
    animation: floatUp linear infinite;
    font-size:14px;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity:0; }
    12% { opacity:.24; }
    88% { opacity:.15; }
    100% { transform: translateY(-110vh) rotate(18deg); opacity:0; }
  }

  .card {
    background: rgba(255,253,251,0.94);
    backdrop-filter: blur(14px);
    border-radius: 24px;
    padding: 30px 26px;
    max-width: 460px;
    width:100%;
    box-shadow: var(--shadow), 0 0 0 1px rgba(217,162,75,.18) inset;
    text-align:center;
    position:relative;
    z-index:1;
    border:1px solid rgba(217,162,75,.22);
  }

  h1 {
    font-family:'Playfair Display', serif;
    font-weight:800;
    font-size:28px; color:var(--rose-deep); margin-bottom:4px;
    letter-spacing:.3px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  h1 .accent { color: var(--gold); font-style:italic; font-weight:700; }
  h1 svg { width:22px; height:22px; flex:none; }
  .sub {
    font-size:12.5px; color:#96687a; margin-bottom:18px; font-weight:600;
    letter-spacing:.2px;
  }
  .divider {
    width:44px; height:2px; margin:12px auto 18px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  input {
    width:100%; padding:14px 16px; border-radius:12px;
    border:1.5px solid var(--line); margin-bottom:12px; font-size:15px;
    outline:none; text-align:center; letter-spacing:.5px;
    font-family:'Manrope',sans-serif; font-weight:600; color:var(--ink);
    background:var(--cream); transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder{ color:#c99cae; font-weight:500; }
  input:focus { border-color:var(--rose); box-shadow:0 0 0 4px rgba(224,70,111,.10); }

  button {
    border:none; border-radius:12px; padding:13px 18px;
    font-size:14px; font-weight:700; cursor:pointer;
    font-family:'Manrope',sans-serif; letter-spacing:.4px;
    transition: transform .12s, box-shadow .12s, opacity .12s, filter .12s;
  }
  button:hover { filter:brightness(1.04); box-shadow: 0 10px 22px rgba(162,39,77,.22); }
  button:active { transform:scale(0.97); }
  .btn-main {
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
    color:#fff8f7; width:100%; margin-top:4px;
    box-shadow: 0 10px 24px rgba(162,39,77,.28);
    text-transform:uppercase; font-size:12.5px; letter-spacing:1.3px;
  }
  .btn-main:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
  .btn-row { display:flex; gap:10px; margin-top:10px; }
  .btn-sec {
    flex:1; background:var(--rose-soft); color:var(--rose-deep); border:1.5px solid var(--line);
    text-transform:uppercase; font-size:12px; letter-spacing:1px;
  }

  .room-code {
    font-family:'Playfair Display', serif;
    font-size:34px; font-weight:800; letter-spacing:9px; color:var(--rose-deep);
    background:var(--gold-soft); border-radius:14px; padding:13px 0; margin:16px 0;
    border:1.5px dashed var(--gold);
  }

  /* ---------- Player row (avatar + name + turn indicator) ---------- */
  .players-row {
    display:flex; align-items:center; justify-content:center; gap:22px;
    margin: 6px 0 18px;
  }
  .player {
    display:flex; flex-direction:column; align-items:center; gap:6px;
    opacity:.55; transition: opacity .25s;
  }
  .player.active { opacity:1; }
  .avatar {
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Playfair Display', serif; font-weight:700; font-size:17px;
    color:#fff8f7; background:linear-gradient(150deg, var(--rose), var(--rose-deep));
    box-shadow:0 6px 14px rgba(162,39,77,.25);
    border:2px solid #fff;
    position:relative;
  }
  .player.active .avatar { box-shadow:0 0 0 3px rgba(224,70,111,.22), 0 6px 14px rgba(162,39,77,.3); }
  .avatar .turn-dot {
    position:absolute; bottom:-3px; right:-3px; width:16px; height:16px; border-radius:50%;
    background:var(--gold); border:2px solid #fff; display:none;
    align-items:center; justify-content:center; font-size:9px;
  }
  .player.active .avatar .turn-dot { display:flex; }
  .player-name { font-size:12px; font-weight:700; color:var(--rose-deep); max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .turn-bar { width:28px; height:3px; border-radius:2px; background:var(--line); }
  .player.active .turn-bar { background: linear-gradient(90deg, var(--gold), var(--rose)); }
  .vs { font-family:'Playfair Display', serif; font-style:italic; color:var(--gold); font-size:14px; }

  /* ---------- Board frame ---------- */
  .board-frame {
    background: linear-gradient(155deg, var(--frame-1), var(--frame-2));
    border-radius: 20px;
    padding: 5px;
    margin: 6px 0 18px;
    box-shadow: 0 14px 30px rgba(120,20,60,.22);
  }
  .board-inner {
    background: linear-gradient(170deg, #fff, var(--rose-soft));
    border-radius: 16px;
    padding: 12px;
  }
  .letters-row {
    display:grid; grid-template-columns: repeat(5,1fr); gap:8px;
    margin-bottom:8px;
  }
  .letters-row span {
    font-family:'Playfair Display', serif; font-weight:800; font-size:19px;
    color:var(--rose-deep);
    position:relative;
    padding:4px 0;
  }
  .letters-row span .lstrike {
    position:absolute; left:12%; top:50%; width:76%; height:2.5px;
    background: var(--gold);
    transform: translateY(-50%) scaleX(0);
    transform-origin:left center;
    transition: transform .4s ease;
    border-radius:2px;
  }
  .letters-row span.struck .lstrike { transform: translateY(-50%) scaleX(1); }

  .grid {
    display:grid; grid-template-columns: repeat(5,1fr); gap:7px;
    user-select:none;
  }
  .cell {
    position:relative;
    aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    background:var(--cream); border:1.5px solid var(--line); border-radius:11px;
    font-weight:700; font-size:16px; color:var(--ink); cursor:default;
    font-family:'Manrope', sans-serif;
    transition: background .2s, border-color .2s, color .3s, transform .15s;
    overflow:hidden;
  }
  .cell.clickable { cursor:pointer; }
  .cell.clickable:hover { border-color:var(--rose); transform:translateY(-1px); }
  .cell.clickable:active { transform:scale(0.94); }

  /* the cross mark: two diagonal strokes that draw in like an X over the number */
  .cell .cross { position:absolute; inset:0; pointer-events:none; }
  .cell .cross i {
    position:absolute; left:10%; top:50%; width:80%; height:2.5px;
    background: var(--rose-deep); border-radius:2px;
    transform-origin:center;
    transition: transform .3s cubic-bezier(.65,0,.35,1);
  }
  .cell .cross i.d1 { transform: translateY(-50%) rotate(45deg) scaleX(0); }
  .cell .cross i.d2 { transform: translateY(-50%) rotate(-45deg) scaleX(0); }
  .cell.marked .cross i.d1 { transform: translateY(-50%) rotate(45deg) scaleX(1); }
  .cell.marked .cross i.d2 { transform: translateY(-50%) rotate(-45deg) scaleX(1); }
  .cell.marked {
    color: var(--rose-deep);
    background: var(--rose-soft);
    border-color: var(--rose);
  }

  .cell.heart-five {
    background: linear-gradient(155deg, var(--gold-soft), #fff);
    border:1.5px solid var(--gold);
    color:var(--rose-deep);
    font-family:'Playfair Display', serif;
    font-size:17px;
  }
  .cell.heart-five svg { position:absolute; top:3px; right:4px; width:10px; height:10px; }
  .cell.heart-five.marked {
    background: linear-gradient(155deg, var(--rose-soft), var(--gold-soft));
  }
  .cell.heart-five .cross i { background: var(--gold); }

  .cell.win-cell {
    animation: winPulse 1s ease-in-out infinite;
  }
  @keyframes winPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(224,70,111,.5); }
    50% { box-shadow: 0 0 0 6px rgba(224,70,111,0); }
  }

  .status-bar {
    display:flex; justify-content:center; align-items:center;
    margin-bottom:10px;
  }
  .timer {
    background:var(--rose-soft); border:1.5px solid var(--line); border-radius:999px;
    padding:6px 18px; font-size:14px; font-weight:800; color:var(--rose-deep);
    font-family:'Playfair Display', serif;
  }
  .timer.low { color:#fff8f7; background:linear-gradient(135deg,var(--rose),var(--rose-deep)); }

  .called-log {
    font-size:11.5px; color:#96687a; margin:10px 0 4px; min-height:16px;
    word-break: break-word; font-weight:600; letter-spacing:.2px;
  }
  .msg { font-size:13.5px; color:var(--rose-deep); margin:10px 0; font-weight:700; }
  .heart-loader { font-size:28px; opacity:.55; animation: pulse 1.4s ease-in-out infinite; color:var(--rose); }
  @keyframes pulse { 0%,100%{transform:scale(1); opacity:.5;} 50%{transform:scale(1.12); opacity:.8;} }

  .winner-wrap { position:relative; padding-top:4px; }
  .winner-badge {
    width:60px; height:60px; margin:0 auto 12px;
    border-radius:50%;
    background: linear-gradient(150deg, var(--gold), var(--rose));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 12px 26px rgba(162,39,77,.32);
    animation: badgeIn .55s cubic-bezier(.2,1.4,.4,1) both;
  }
  .winner-badge svg { width:26px; height:26px; }
  @keyframes badgeIn { from{ transform:scale(0.3) rotate(-25deg); opacity:0; } to{ transform:scale(1) rotate(0); opacity:1; } }
  .winner-eyebrow {
    font-size:11px; letter-spacing:2.5px; text-transform:uppercase;
    color:var(--gold); font-weight:800; margin-bottom:6px;
  }
  .winner-banner {
    font-family:'Playfair Display', serif;
    font-size:25px; font-weight:800; color:var(--rose-deep); margin-bottom:4px;
    animation: fadeUp .5s ease .05s both;
  }
  .winner-sub { font-size:12.5px; color:#96687a; font-weight:600; margin-bottom:16px; animation: fadeUp .5s ease .12s both; }
  @keyframes fadeUp { from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

  .confetti { position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:22px; z-index:2; }
  .confetti span {
    position:absolute; top:-10px; font-size:12px;
    animation: confettiFall 2.6s ease-in forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity:1; }
    100% { transform: translateY(340px) rotate(280deg); opacity:0; }
  }

  .error { color:#a13b3b; font-size:12.5px; margin-top:8px; font-weight:700; }
</style>
</head>
<body>
<div class="hearts-bg" id="heartsBg"></div>
<div class="card" id="app"><div class="heart-loader">&#10084;</div></div>

<script>
const API = '/api';
const APP = document.getElementById('app');
const LETTERS = ['T','A','Z','Z','U'];
let myName = '';
let myId = '';
let roomCode = '';
let pollHandle = null;
let timerInterval = null;
let myBoardNums = [];
let localAutoCallDone = false;
const TURN_SECONDS = 15;

function heartIcon(){
  return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.6 8.1 2.6 4.5 6 4.1c2-.2 3.6.8 6 3 2.4-2.2 4-3.2 6-3 3.4.4 5.4 4 3 7.6C19.5 16.4 12 21 12 21z"/></svg>';
}

(function initHeartsBg(){
  const bg = document.getElementById('heartsBg');
  for(let i=0;i<10;i++){
    const s = document.createElement('span');
    s.textContent = '\u2764';
    s.style.left = Math.random()*100 + 'vw';
    s.style.fontSize = (10 + Math.random()*14) + 'px';
    s.style.animationDuration = (14 + Math.random()*14) + 's';
    s.style.animationDelay = (Math.random()*10) + 's';
    bg.appendChild(s);
  }
})();

async function api(path, method='GET', body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(API + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function shuffleArr(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function genBoard(){
  const nums = [];
  for(let i=1;i<=25;i++) nums.push(i);
  return shuffleArr(nums);
}
function gridNumberAt(idx){ return myBoardNums[idx]; }
function otherId(id){ return id==='p1' ? 'p2' : 'p1'; }

// struckCount = how many of T-A-Z-Z-U are matched so far (0-5). Letters
// strike in order left-to-right, one per completed row/column/diagonal -
// it does NOT matter which line completed, just how many total.
function lettersRowHtml(struckCount){
  return LETTERS.map((l,i)=>`<span class="${i<struckCount?'struck':''}">${l}<span class="lstrike"></span></span>`).join('');
}

function renderJoin(errorMsg){
  stopPoll();
  APP.innerHTML = `
    <h1>${heartIcon()}Tazzu <span class="accent">Bingo</span></h1>
    <div class="sub">A sweet little 5×5 bingo, just for the two of you</div>
    <div class="divider"></div>
    <input id="nameInput" placeholder="Your name" maxlength="14" />
    <input id="codeInput" placeholder="Room code (leave blank to create)" maxlength="4" />
    <button class="btn-main" id="joinBtn">Join / Create Room</button>
    ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
  `;
  document.getElementById('joinBtn').onclick = handleJoin;
}

async function handleJoin(){
  const name = document.getElementById('nameInput').value.trim();
  const code = document.getElementById('codeInput').value.trim();
  if(!name){ renderJoin('Please enter your name'); return; }
  try {
    const data = await api('/rooms', 'POST', { name, code: code || undefined });
    myName = name;
    roomCode = data.code;
    myId = data.playerId;
    myBoardNums = genBoard();
    await api(`/rooms/${roomCode}/board`, 'POST', { playerId: myId, board: myBoardNums });
    startPoll();
  } catch(e){
    renderJoin(e.message);
  }
}

function renderWaiting(room){
  APP.innerHTML = `
    <h1>Waiting<span class="accent">...</span></h1>
    <div class="sub">Share this code with your partner</div>
    <div class="room-code">${room.code}</div>
    <div class="players-row">
      ${room.players.map(p=>`
        <div class="player active">
          <div class="avatar">${p.name.charAt(0).toUpperCase()}</div>
          <div class="player-name">${p.name}${p.id===myId?' (you)':''}</div>
        </div>`).join('')}
    </div>
    <div class="msg">Waiting for your partner to join...</div>
    <div class="heart-loader">&#10084;</div>
  `;
}

function renderArrange(room){
  APP.innerHTML = `
    <h1>Arrange Your Board</h1>
    <div class="sub">The heart cell (5) is your special one — shuffle till it feels right</div>
    <div class="board-frame"><div class="board-inner">
      <div class="letters-row">${lettersRowHtml(0)}</div>
      <div class="grid" id="grid"></div>
    </div></div>
    <div class="btn-row">
      <button class="btn-sec" id="shuffleBtn">Shuffle</button>
      <button class="btn-main" id="readyBtn" style="flex:1">Ready</button>
    </div>
    <div class="msg" id="readyMsg">${room.ready && room.ready.includes(myId) ? 'Waiting for your partner...' : ''}</div>
  `;
  drawGrid([], { interactive:false });
  document.getElementById('shuffleBtn').onclick = async () => {
    myBoardNums = genBoard();
    await api(`/rooms/${roomCode}/board`, 'POST', { playerId: myId, board: myBoardNums });
    drawGrid([], { interactive:false });
  };
  document.getElementById('readyBtn').onclick = async () => {
    await api(`/rooms/${roomCode}/ready`, 'POST', { playerId: myId });
    document.getElementById('readyMsg').textContent = 'Waiting for your partner...';
  };
}

// interactive: if true, unmarked cells are clickable and calling = tapping your own cell
function drawGrid(markedNums, opts){
  opts = opts || {};
  const grid = document.getElementById('grid');
  if(!grid) return;
  const markedSet = new Set(markedNums);
  const winCells = opts.winCells || new Set();
  let html = '';
  for(let i=0;i<25;i++){
    const n = gridNumberAt(i);
    const marked = markedSet.has(n);
    const isFive = n === 5;
    const isWin = winCells.has(i);
    const clickable = opts.interactive && !marked;
    html += `<div class="cell ${marked?'marked':''} ${isFive?'heart-five':''} ${isWin?'win-cell':''} ${clickable?'clickable':''}" data-idx="${i}" data-n="${n}">
      ${n}${isFive ? heartIcon() : ''}
      <span class="cross"><i class="d1"></i><i class="d2"></i></span>
    </div>`;
  }
  grid.innerHTML = html;
  if(opts.interactive && opts.onCellClick){
    grid.querySelectorAll('.cell.clickable').forEach(el=>{
      el.onclick = () => opts.onCellClick(parseInt(el.dataset.n));
    });
  }
}

function renderPlaying(room){
  const me = room.players.find(p=>p.id===myId);
  const opp = room.players.find(p=>p.id!==myId);
  const myTurn = room.turn === myId;
  const progress = room.progress || { p1:0, p2:0 };
  const myMatches = progress[myId] || 0;
  const oppId = otherId(myId);
  const oppMatches = progress[oppId] || 0;

  APP.innerHTML = `
    <div class="players-row">
      <div class="player ${myTurn?'active':''}">
        <div class="avatar">${me?me.name.charAt(0).toUpperCase():''}<span class="turn-dot">${heartIcon()}</span></div>
        <div class="player-name">${me?me.name:''}</div>
        <div class="turn-bar"></div>
      </div>
      <div class="vs">&amp;</div>
      <div class="player ${!myTurn?'active':''}">
        <div class="avatar">${opp?opp.name.charAt(0).toUpperCase():'?'}<span class="turn-dot">${heartIcon()}</span></div>
        <div class="player-name">${opp?opp.name:'...'}</div>
        <div class="turn-bar"></div>
      </div>
    </div>
    <div class="status-bar"><span class="timer" id="timerBox">--</span></div>
    <div class="msg" id="turnMsg">${myTurn ? "Your turn — tap a number on your board" : (opp?opp.name:'Partner')+"'s turn..."}</div>
    <div class="board-frame"><div class="board-inner">
      <div class="letters-row">${lettersRowHtml(myMatches)}</div>
      <div class="grid" id="grid"></div>
    </div></div>
    <div class="msg" style="margin-top:8px;">You: ${myMatches}/5 matched &middot; ${opp?opp.name:'Partner'}: ${oppMatches}/5 matched</div>
    <div class="called-log">Called: ${room.calledNumbers.length ? room.calledNumbers.join(', ') : 'none yet'}</div>
  `;
  drawGrid(room.calledNumbers, {
    interactive: myTurn,
    onCellClick: (n) => callNumber(n)
  });

  if(timerInterval) clearInterval(timerInterval);
  localAutoCallDone = false;
  timerInterval = setInterval(()=>{
    if(!room.turnStartedAt) return;
    const elapsed = Math.floor((Date.now()-room.turnStartedAt)/1000);
    const left = TURN_SECONDS - elapsed;
    const box = document.getElementById('timerBox');
    if(box){
      box.textContent = Math.max(left,0)+'s';
      box.classList.toggle('low', left<=5);
    }
    if(left<=0 && myTurn && !localAutoCallDone){
      localAutoCallDone = true;
      autoCall();
    }
  },300);
}

async function callNumber(n){
  try { await api(`/rooms/${roomCode}/call`, 'POST', { playerId: myId, number: n }); }
  catch(e) { /* ignore race - poll will resync */ }
}

async function autoCall(){
  const remaining = [];
  const res = await fetch(`${API}/rooms/${roomCode}?playerId=${myId}`);
  const { room } = await res.json();
  for(let i=1;i<=25;i++) if(!room.calledNumbers.includes(i)) remaining.push(i);
  if(remaining.length===0) return;
  const pick = remaining[Math.floor(Math.random()*remaining.length)];
  await callNumber(pick);
}

function confettiHtml(){
  const dur = () => (2 + Math.random()*1.4);
  let html = '';
  for(let i=0;i<20;i++){
    const left = Math.random()*100;
    const delay = Math.random()*0.6;
    html += `<span style="left:${left}%; animation-delay:${delay}s; animation-duration:${dur()}s; color:${Math.random()>0.5?'var(--rose)':'var(--gold)'};">&#10084;</span>`;
  }
  return html;
}

// Given the winner's own board and winLines (array of [r,c]-pair lines),
// figure out every grid index to highlight across all matched lines.
function analyzeWinLines(winLines){
  const winCells = new Set();
  (winLines || []).forEach(line => {
    line.forEach(([r,c]) => winCells.add(r*5 + c));
  });
  return { winCells };
}

function renderFinished(room){
  if(timerInterval) clearInterval(timerInterval);
  const winner = room.players.find(p=>p.id===room.winner);
  const iWon = room.winner === myId;
  const title = iWon ? 'You Won!' : (winner ? winner.name + ' Won!' : 'Game Over');
  const sub = iWon ? 'TAZZU complete — 5 matches, well played' : "Your partner matched all 5 — this round's theirs";
  const { winCells } = analyzeWinLines(room.winLines);
  const matchCount = Math.min((room.progress && room.progress[room.winner]) || 5, 5);

  APP.innerHTML = `
    <div class="winner-wrap">
      <div class="confetti">${confettiHtml()}</div>
      <div class="winner-badge">${heartIcon()}</div>
      <div class="winner-eyebrow">Tazzu — 5 matches</div>
      <div class="winner-banner">${title}</div>
      <div class="winner-sub">${sub}</div>
      <div class="board-frame"><div class="board-inner">
        <div class="letters-row">${lettersRowHtml(matchCount)}</div>
        <div class="grid" id="grid"></div>
      </div></div>
      <button class="btn-main" id="againBtn" style="margin-top:18px;">Play Again</button>
    </div>
  `;
  drawGrid(room.calledNumbers, { interactive:false, winCells });
  document.getElementById('againBtn').onclick = async () => {
    await api(`/rooms/${roomCode}/reset`, 'POST', { playerId: myId });
    myBoardNums = genBoard();
    await api(`/rooms/${roomCode}/board`, 'POST', { playerId: myId, board: myBoardNums });
  };
}

function startPoll(){
  stopPoll();
  pollHandle = setInterval(tick, 1200);
  tick();
}
function stopPoll(){
  if(pollHandle){ clearInterval(pollHandle); pollHandle = null; }
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}
async function tick(){
  let room;
  try {
    const res = await fetch(`${API}/rooms/${roomCode}?playerId=${myId}`);
    if(!res.ok) return;
    const data = await res.json();
    room = data.room;
    if(room.myBoard) myBoardNums = room.myBoard;
  } catch(e){ return; }

  if(room.status === 'waiting'){
    if(room.players.length >= 2) renderArrange(room);
    else renderWaiting(room);
  } else if(room.status === 'arranging'){
    renderArrange(room);
  } else if(room.status === 'playing'){
    renderPlaying(room);
  } else if(room.status === 'finished'){
    renderFinished(room);
  }
}

renderJoin();
</script>
