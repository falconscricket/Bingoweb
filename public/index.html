<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Couple Bingo 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-1:#ff7aa2; --pink-2:#e0356b; --pink-3:#ff9fc0;
    --gold:#ffb648; --gold-2:#ff8f4d;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:'Quicksand', sans-serif;
    background: radial-gradient(circle at 20% 15%, #ffd7e6 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, #ffe1cf 0%, transparent 45%),
                linear-gradient(135deg,#ff9a9e 0%,#fecfef 55%,#ffe3ee 100%);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:16px;
    color:#5a2a3a;
    overflow:hidden;
    position:relative;
  }
  .hearts-bg { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .hearts-bg span {
    position:absolute; bottom:-40px; font-size:20px; opacity:.35;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity:0; }
    10% { opacity:.4; }
    90% { opacity:.3; }
    100% { transform: translateY(-110vh) rotate(30deg); opacity:0; }
  }
  .card {
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(10px);
    border-radius: 28px;
    padding: 28px 24px;
    max-width: 460px;
    width:100%;
    box-shadow: 0 20px 50px rgba(200,50,90,0.28), 0 0 0 1px rgba(255,255,255,0.6) inset;
    text-align:center;
    position:relative;
    z-index:1;
  }
  h1 {
    font-family:'Baloo 2', cursive;
    font-size:30px; color:var(--pink-2); margin-bottom:4px;
    text-shadow: 0 2px 0 rgba(255,255,255,.6);
  }
  .sub { font-size:13px; color:#a25d72; margin-bottom:20px; font-weight:600; }
  input {
    width:100%; padding:13px 14px; border-radius:16px;
    border:2px solid #ffc4d6; margin-bottom:12px; font-size:16px;
    outline:none; text-align:center; letter-spacing:1px;
    font-family:'Quicksand',sans-serif; font-weight:600; color:#5a2a3a;
    background:#fff; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color:var(--pink-2); box-shadow:0 0 0 4px rgba(224,53,107,.15); }
  button {
    border:none; border-radius:16px; padding:13px 18px;
    font-size:15px; font-weight:700; cursor:pointer;
    font-family:'Quicksand',sans-serif;
    transition: transform .12s, box-shadow .12s, opacity .12s;
  }
  button:hover { box-shadow: 0 6px 18px rgba(224,53,107,.25); }
  button:active { transform:scale(0.96); }
  .btn-main {
    background: linear-gradient(135deg,var(--pink-1),var(--pink-2));
    color:#fff; width:100%; margin-top:4px;
    box-shadow: 0 8px 20px rgba(224,53,107,.35);
  }
  .btn-main:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
  .btn-row { display:flex; gap:10px; margin-top:10px; }
  .btn-sec {
    flex:1; background:#fff0f4; color:var(--pink-2); border:2px solid #ffc4d6;
  }
  .room-code {
    font-family:'Baloo 2', cursive;
    font-size:36px; font-weight:800; letter-spacing:8px; color:var(--pink-2);
    background:#fff0f4; border-radius:16px; padding:12px 0; margin:16px 0;
    border:2px dashed #ffb6c8;
  }
  .players { display:flex; justify-content:center; gap:16px; margin:14px 0; flex-wrap:wrap; }
  .chip {
    background:#fff0f4; border:2px solid #ffc4d6; border-radius:999px;
    padding:8px 16px; font-size:14px; font-weight:700; color:#c22b5c;
  }
  .chip.me { background:linear-gradient(135deg,var(--pink-1),var(--pink-2)); border-color:var(--pink-2); color:#fff; }
  .grid {
    display:grid; grid-template-columns: repeat(5,1fr); gap:7px;
    margin:18px 0; user-select:none;
  }
  .cell {
    position:relative;
    aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    background:#fff5f8; border:2px solid #ffd3e0; border-radius:12px;
    font-weight:700; font-size:17px; color:#7a2d47; cursor:default;
    transition: all .18s;
  }
  .cell.marked {
    background: linear-gradient(135deg,var(--gold),var(--gold-2));
    color:#fff; border-color:var(--gold-2);
    transform: scale(1.04);
    box-shadow: 0 4px 12px rgba(255,143,77,.4);
  }
  /* number 5 - the special "heart number" cell, always stands out */
  .cell.heart-five {
    background: linear-gradient(145deg,#ff8fab,#e0356b);
    color:#fff;
    border:2px solid #ff5f8f;
    box-shadow: 0 0 0 3px rgba(255,255,255,.5) inset, 0 6px 16px rgba(224,53,107,.45);
    font-size:19px;
  }
  .cell.heart-five::before {
    content:"💗";
    position:absolute; top:2px; right:3px; font-size:9px; opacity:.85;
  }
  .cell.heart-five.marked {
    background: linear-gradient(145deg,#ffd35a,#ff5f8f);
    box-shadow: 0 0 0 3px rgba(255,255,255,.6) inset, 0 0 16px rgba(255,143,77,.6);
    animation: heartPulse 1.1s ease-in-out infinite;
  }
  @keyframes heartPulse {
    0%,100% { transform:scale(1.04); }
    50% { transform:scale(1.12); }
  }
  .status-bar {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:10px; font-size:14px; font-weight:700; color:#c22b5c;
  }
  .timer {
    background:#fff0f4; border:2px solid #ffc4d6; border-radius:999px;
    padding:5px 16px; font-size:15px; font-weight:800; color:var(--pink-2);
    font-family:'Baloo 2', cursive;
  }
  .timer.low { color:#fff; background:linear-gradient(135deg,var(--pink-1),var(--pink-2)); }
  .callpad {
    display:grid; grid-template-columns: repeat(5,1fr); gap:6px; margin:16px 0;
  }
  .callbtn {
    background:#fff; border:2px solid #ffc4d6; border-radius:10px;
    padding:9px 0; font-size:14px; font-weight:700; color:#7a2d47;
    position:relative;
  }
  .callbtn.is-five { border-color:var(--pink-2); color:var(--pink-2); background:#fff0f4; }
  .callbtn.used { background:#eee; color:#bbb; border-color:#ddd; cursor:not-allowed; }
  .callbtn:disabled { cursor:not-allowed; opacity:.6; }
  .called-log {
    font-size:12px; color:#a25d72; margin-bottom:8px; min-height:16px;
    word-break: break-word; font-weight:600;
  }
  .msg { font-size:14px; color:#c22b5c; margin:10px 0; font-weight:700; }
  .heart-loader { font-size:34px; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.2);} }
  .winner-banner {
    font-family:'Baloo 2', cursive;
    font-size:24px; font-weight:800; color:var(--pink-2); margin:14px 0;
  }
  .error { color:#c0392b; font-size:13px; margin-top:6px; font-weight:700; }
</style>
</head>
<body>
<div class="hearts-bg" id="heartsBg"></div>
<div class="card" id="app"><div class="heart-loader">💗</div></div>

<script>
const API = '/api';
const APP = document.getElementById('app');
let myName = '';
let myId = '';
let roomCode = '';
let pollHandle = null;
let timerInterval = null;
let myBoardNums = [];
let localAutoCallDone = false;
const TURN_SECONDS = 15;

// ---------- Ambient floating hearts ----------
(function initHeartsBg(){
  const bg = document.getElementById('heartsBg');
  const symbols = ['💗','💕','💓','💖'];
  for(let i=0;i<14;i++){
    const s = document.createElement('span');
    s.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    s.style.left = Math.random()*100 + 'vw';
    s.style.fontSize = (14 + Math.random()*18) + 'px';
    s.style.animationDuration = (10 + Math.random()*12) + 's';
    s.style.animationDelay = (Math.random()*10) + 's';
    bg.appendChild(s);
  }
})();

// ---------- API helpers ----------
async function api(path, method='GET', body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(API + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function shuffleArr(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function genBoard(){
  const nums = [];
  for(let i=1;i<=25;i++) nums.push(i);
  return shuffleArr(nums);
}
function gridNumberAt(idx){ return myBoardNums[idx]; }
function otherId(id){ return id==='p1' ? 'p2' : 'p1'; }

// ---------- Screens ----------
function renderJoin(errorMsg){
  stopPoll();
  APP.innerHTML = `
    <h1>Couple Bingo 💕</h1>
    <div class="sub">Play the sweet 5x5 bingo together, on two phones</div>
    <input id="nameInput" placeholder="Your name" maxlength="14" />
    <input id="codeInput" placeholder="Room code (leave blank to create)" maxlength="4" />
    <button class="btn-main" id="joinBtn">Join / Create Room</button>
    ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
  `;
  document.getElementById('joinBtn').onclick = handleJoin;
}

async function handleJoin(){
  const name = document.getElementById('nameInput').value.trim();
  const code = document.getElementById('codeInput').value.trim();
  if(!name){ renderJoin('Enter your name 💗'); return; }
  try {
    const data = await api('/rooms', 'POST', { name, code: code || undefined });
    myName = name;
    roomCode = data.code;
    myId = data.playerId;
    myBoardNums = genBoard();
    await api(`/rooms/${roomCode}/board`, 'POST', { playerId: myId, board: myBoardNums });
    startPoll();
  } catch(e){
    renderJoin(e.message);
  }
}

function renderWaiting(room){
  APP.innerHTML = `
    <h1>Waiting... 💌</h1>
    <div class="room-code">${room.code}</div>
    <div class="sub">Share this code with your partner</div>
    <div class="players">
      ${room.players.map(p=>`<div class="chip ${p.id===myId?'me':''}">${p.name}</div>`).join('')}
    </div>
    <div class="msg">Waiting for your partner to join...</div>
    <div class="heart-loader">💓</div>
  `;
}

function renderArrange(room){
  APP.innerHTML = `
    <h1>Arrange your board</h1>
    <div class="sub">The pink glowing cell is your number 5 💗 — shuffle till you like it</div>
    <div class="grid" id="grid"></div>
    <div class="btn-row">
      <button class="btn-sec" id="shuffleBtn">🔀 Shuffle</button>
      <button class="btn-main" id="readyBtn" style="flex:1">Ready!</button>
    </div>
    <div class="msg" id="readyMsg">${room.ready && room.ready.includes(myId) ? 'Waiting for partner... 💗' : ''}</div>
  `;
  drawGrid([]);
  document.getElementById('shuffleBtn').onclick = async () => {
    myBoardNums = genBoard();
    await api(`/rooms/${roomCode}/board`, 'POST', { playerId: myId, board: myBoardNums });
    drawGrid([]);
  };
  document.getElementById('readyBtn').onclick = async () => {
    await api(`/rooms/${roomCode}/ready`, 'POST', { playerId: myId });
    document.getElementById('readyMsg').textContent = 'Waiting for partner... 💗';
  };
}

function drawGrid(markedNums){
  const grid = document.getElementById('grid');
  if(!grid) return;
  const markedSet = new Set(markedNums);
  let html = '';
  for(let i=0;i<25;i++){
    const n = gridNumberAt(i);
    const marked = markedSet.has(n);
    const isFive = n === 5;
    html += `<div class="cell ${marked?'marked':''} ${isFive?'heart-five':''}">${n}</div>`;
  }
  grid.innerHTML = html;
}

function renderPlaying(room){
  const me = room.players.find(p=>p.id===myId);
  const opp = room.players.find(p=>p.id!==myId);
  const myTurn = room.turn === myId;
  const markedSet = new Set(room.calledNumbers);

  APP.innerHTML = `
    <div class="status-bar">
      <span>💗 ${me?me.name:''}</span>
      <span class="timer" id="timerBox">--</span>
      <span>${opp?opp.name:'...'} 💗</span>
    </div>
    <div class="msg" id="turnMsg">${myTurn ? "Your turn! Call a number 💌" : (opp?opp.name:'Partner')+"'s turn..."}</div>
    <div class="grid" id="grid"></div>
    <div class="called-log">Called: ${room.calledNumbers.length ? room.calledNumbers.join(', ') : 'none yet'}</div>
    <div class="callpad" id="callpad"></div>
  `;
  drawGrid(room.calledNumbers);

  const pad = document.getElementById('callpad');
  let padHtml = '';
  for(let i=1;i<=25;i++){
    const used = markedSet.has(i);
    const isFive = i === 5;
    padHtml += `<button class="callbtn ${used?'used':''} ${isFive?'is-five':''}" data-n="${i}" ${(!myTurn||used)?'disabled':''}>${i}</button>`;
  }
  pad.innerHTML = padHtml;
  if(myTurn){
    pad.querySelectorAll('.callbtn:not(.used)').forEach(btn=>{
      btn.onclick = () => callNumber(parseInt(btn.dataset.n));
    });
  }

  if(timerInterval) clearInterval(timerInterval);
  localAutoCallDone = false;
  timerInterval = setInterval(()=>{
    if(!room.turnStartedAt) return;
    const elapsed = Math.floor((Date.now()-room.turnStartedAt)/1000);
    const left = TURN_SECONDS - elapsed;
    const box = document.getElementById('timerBox');
    if(box){
      box.textContent = Math.max(left,0)+'s';
      box.classList.toggle('low', left<=5);
    }
    if(left<=0 && myTurn && !localAutoCallDone){
      localAutoCallDone = true;
      autoCall();
    }
  },300);
}

async function callNumber(n){
  try { await api(`/rooms/${roomCode}/call`, 'POST', { playerId: myId, number: n }); }
  catch(e) { /* ignore race - poll will resync */ }
}

async function autoCall(){
  const remaining = [];
  const res = await fetch(`${API}/rooms/${roomCode}?playerId=${myId}`);
  const { room } = await res.json();
  for(let i=1;i<=25;i++) if(!room.calledNumbers.includes(i)) remaining.push(i);
  if(remaining.length===0) return;
  const pick = remaining[Math.floor(Math.random()*remaining.length)];
  await callNumber(pick);
}

function renderFinished(room){
  if(timerInterval) clearInterval(timerInterval);
  const winner = room.players.find(p=>p.id===room.winner);
  const iWon = room.winner === myId;
  APP.innerHTML = `
    <div class="winner-banner">${iWon ? '🎉 You won! 💕' : (winner ? winner.name+' won! 💕' : 'Game Over')}</div>
    <div class="grid" id="grid"></div>
    <button class="btn-main" id="againBtn" style="margin-top:16px;">Play Again 💗</button>
  `;
  drawGrid(room.calledNumbers);
  document.getElementById('againBtn').onclick = async () => {
    await api(`/rooms/${roomCode}/reset`, 'POST', { playerId: myId });
    myBoardNums = genBoard();
    await api(`/rooms/${roomCode}/board`, 'POST', { playerId: myId, board: myBoardNums });
  };
}

// ---------- Poll loop ----------
function startPoll(){
  stopPoll();
  pollHandle = setInterval(tick, 1200);
  tick();
}
function stopPoll(){
  if(pollHandle){ clearInterval(pollHandle); pollHandle = null; }
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}
async function tick(){
  let room;
  try {
    const res = await fetch(`${API}/rooms/${roomCode}?playerId=${myId}`);
    if(!res.ok) return;
    const data = await res.json();
    room = data.room;
    if(room.myBoard) myBoardNums = room.myBoard;
  } catch(e){ return; }

  if(room.status === 'waiting'){
    if(room.players.length >= 2) renderArrange(room);
    else renderWaiting(room);
  } else if(room.status === 'arranging'){
    renderArrange(room);
  } else if(room.status === 'playing'){
    renderPlaying(room);
  } else if(room.status === 'finished'){
    renderFinished(room);
  }
}

renderJoin();
</script>
</body>
</html>
